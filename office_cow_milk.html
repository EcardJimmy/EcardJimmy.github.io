<script>
/* 縮放 */
const stage=document.getElementById('stage');
function fit(){stage.style.transform=`scale(${Math.min(innerWidth/1600,innerHeight/900)})`;}
addEventListener('resize',fit);fit();

const $=id=>document.getElementById(id);
const LOOP=10;                       // 一次循環 10 秒
const L1=162,L2=162;                 // 手臂長度
const SH_BACK={x:878,y:512}, SH_FRONT={x:862,y:516};
const P={desk:{x:690,y:532}, udder:{x:1095,y:726}, mouth:{x:936,y:470},
         rest:{x:955,y:598}, teat:{x:1096,y:660}};

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const prog=(t,a,b)=>ease(clamp((t-a)/(b-a)));
const lerp=(a,b,k)=>a+(b-a)*k;
const lp=(p,q,k)=>({x:lerp(p.x,q.x,k),y:lerp(p.y,q.y,k)});

function ik(sh,hand){            // 兩節手臂，手肘朝下
  let dx=hand.x-sh.x,dy=hand.y-sh.y,d=Math.hypot(dx,dy);
  d=Math.min(d,L1+L2-1);
  const a=Math.atan2(dy,dx), off=Math.acos(clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1));
  const e1={x:sh.x+L1*Math.cos(a+off),y:sh.y+L1*Math.sin(a+off)};
  const e2={x:sh.x+L1*Math.cos(a-off),y:sh.y+L1*Math.sin(a-off)};
  const hint={x:sh.x+25,y:sh.y+150};
  const e=Math.hypot(e1.x-hint.x,e1.y-hint.y)<Math.hypot(e2.x-hint.x,e2.y-hint.y)?e1:e2;
  return `M${sh.x} ${sh.y} L${e.x.toFixed(1)} ${e.y.toFixed(1)} L${hand.x.toFixed(1)} ${hand.y.toFixed(1)}`;
}

function render(T){
  const t=((T%LOOP)+LOOP)%LOOP;

  /* --- 杯子手 --- */
  let cup, tilt=0, fill=0;
  if(t<0.8) cup=P.desk;
  else if(t<2.0) cup=lp(P.desk,P.udder,prog(t,0.8,2.0));
  else if(t<6.0) cup=P.udder;
  else if(t<7.0) cup=lp(P.udder,P.mouth,prog(t,6.0,7.0));
  else if(t<8.6) cup=P.mouth;
  else if(t<9.6) cup=lp(P.mouth,P.desk,prog(t,8.6,9.6));
  else cup=P.desk;
  tilt = t<6.3?0 : t<7.0? -55*prog(t,6.3,7.0) : t<8.6? -55-15*prog(t,7.0,8.4) : -70*(1-prog(t,8.6,9.4));
  // 喝的時候微微吞嚥晃動
  let sip = (t>7.0&&t<8.4)? Math.sin((t-7)*14)*3 : 0;
  const cupPos={x:cup.x, y:cup.y+sip};

  /* --- 擠奶手 --- */
  let squeeze=0, hf;
  if(t<2.0) hf=P.rest;
  else if(t<2.5) hf=lp(P.rest,P.teat,prog(t,2.0,2.5));
  else if(t<6.0){ squeeze=(1-Math.cos((t-2.5)*2*Math.PI/0.45))/2; hf={x:P.teat.x,y:P.teat.y+squeeze*12}; }
  else if(t<6.5) hf=lp(P.teat,P.rest,prog(t,6.0,6.5));
  else hf=P.rest;

  /* --- 牛奶量 --- */
  if(t>=2.5&&t<6.0) fill=0.88*clamp((t-2.6)/3.3);
  else if(t>=6.0&&t<7.0) fill=0.88;
  else if(t>=7.0&&t<8.4) fill=0.88*(1-prog(t,7.0,8.4));
  const h=50*fill;
  $('milk').setAttribute('y',26-h);$('milk').setAttribute('height',h);
  $('milkTop').setAttribute('y',26-h);$('milkTop').setAttribute('opacity',fill>0.02?1:0);

  $('cup').setAttribute('transform',`translate(${cupPos.x} ${cupPos.y}) rotate(${tilt})`);
  $('handBack').setAttribute('cx',cupPos.x-24);$('handBack').setAttribute('cy',cupPos.y+4);
  $('armBack').setAttribute('d',ik(SH_BACK,{x:cupPos.x-24,y:cupPos.y+4}));
  $('handFront').setAttribute('cx',hf.x);$('handFront').setAttribute('cy',hf.y);
  $('armFront').setAttribute('d',ik(SH_FRONT,hf));

  /* --- 乳頭與奶流 --- */
  $('teat').setAttribute('height',26+squeeze*10);
  const streamOn=(t>2.6&&t<6.0)?clamp(squeeze*1.6-0.2):0;
  const st=$('stream');
  st.setAttribute('y1',668+squeeze*10);st.setAttribute('y2',cupPos.y-24+(50-h));
  st.setAttribute('opacity',streamOn);st.setAttribute('stroke-dashoffset',(-t*260).toFixed(1));

  /* --- 頭部 --- */
  let headRot = t<6.3?Math.sin(t*1.3)*1.5 : t<8.6? -12*prog(t,6.3,7.0) : -12*(1-prog(t,8.6,9.2));
  if(t>8.6&&t<9.6) headRot += Math.sin((t-8.6)*10)*2;     // 滿足地搖頭
  $('head').setAttribute('transform',`rotate(${headRot.toFixed(2)} 872 500)`);
  const drinking=t>7.0&&t<8.4;
  $('mouth').setAttribute('d',drinking?'M908 470 Q916 482 926 470 Z':(t>8.4&&t<9.8)?'M904 470 Q916 488 928 469':'M906 474 Q916 480 925 473');
  $('mustache').setAttribute('opacity',t<8.4?0:t<9.4?1:1-prog(t,9.4,10));
  $('eye').setAttribute('ry',4.5);
  const blinkMan=(t%3.3)<0.12; $('eye').setAttribute('r',blinkMan?1.5:4.5);

  /* --- 乳牛 --- */
  $('tail').setAttribute('transform',`rotate(${(Math.sin(t*2*Math.PI/2.5)*16).toFixed(2)} 962 470)`);
  $('muzzle').setAttribute('transform',`translate(${(Math.sin(t*2*Math.PI/1.25)*3).toFixed(2)} ${(Math.abs(Math.sin(t*2*Math.PI/1.25))*3).toFixed(2)})`);
  const blinkCow=((t+1.1)%2.5)<0.15;
  $('cowEyes').setAttribute('transform',blinkCow?'translate(0 425) scale(1 .15) translate(0 -425)':'');
  const moo=t>3.0&&t<4.7;
  $('cowHead').setAttribute('transform',moo?`rotate(${(-6*Math.sin(clamp((t-3)/1.7)*Math.PI)).toFixed(2)} 1400 470)`:'');
  $('cowMouth').setAttribute('d',moo?'M1405 482 Q1420 500 1435 482 Z':'M1405 486 Q1420 492 1435 486');
  $('bubbleCow').setAttribute('opacity',moo?1:0);

  /* --- 對話泡泡、愛心 --- */
  $('bubbleMan').setAttribute('opacity',(t>8.5&&t<9.9)?1:0);
  const hk=(t>8.6&&t<10)?(t-8.6)/1.4:-1;
  $('hearts').setAttribute('opacity',hk<0?0:(1-hk));
  $('hearts').setAttribute('transform',`translate(0 ${hk<0?0:(-40*hk).toFixed(1)})`);

  /* --- 背景 --- */
  $('cloud1').setAttribute('transform',`translate(${(200+Math.sin(t*2*Math.PI/LOOP)*40).toFixed(1)} 160)`);
  $('cloud2').setAttribute('transform',`translate(${(430-Math.sin(t*2*Math.PI/LOOP)*30).toFixed(1)} 195)`);
  $('minHand').setAttribute('transform',`rotate(${(t/LOOP*360).toFixed(1)})`);
  $('hourHand').setAttribute('transform',`rotate(${(120+t/LOOP*30).toFixed(1)})`);
  $('cursor').setAttribute('opacity',(t%1)<0.5?1:0);
}
window.renderAt=render;

/* 自動播放（錄影時改用 renderAt 逐格繪製） */
if(!location.hash.includes('manual')){
  const t0=performance.now();
  (function loop(now){render((now-t0)/1000);requestAnimationFrame(loop);})(t0);
}else render(0);
</script>
</body>
</html>
